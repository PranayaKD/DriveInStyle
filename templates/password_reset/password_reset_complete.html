{% extends 'navbar.html' %}
{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fade-in glass-card text-center">
    <div class="auth-icon-success mx-auto mb-4">
      <i class="bi bi-check-lg"></i>
    </div>
    <h2 class="auth-title" style="color: var(--color-accent-emerald);">Password Reset Complete!</h2>
    <p class="auth-subtitle mb-4">
      Your password has been successfully changed. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn btn-gradient-primary btn-modern px-5 py-3">
      <i class="bi bi-box-arrow-in-right me-2"></i>Log In Now
    </a>
  </div>
</div>
{% endblock %}
