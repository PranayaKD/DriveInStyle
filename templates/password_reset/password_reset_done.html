{% extends 'navbar.html' %}
{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fade-in glass-card text-center">
    <div class="auth-icon-glow mb-4" style="background: linear-gradient(135deg, var(--color-accent-emerald), var(--color-accent-cyan));">
      <i class="bi bi-envelope-check-fill"></i>
    </div>
    <h2 class="auth-title">Check Your Email</h2>
    <p class="auth-subtitle mb-4">
      If an account exists with that email address, we've sent password reset instructions.
      Please check your inbox and spam folder.
    </p>
    <a href="{% url 'login' %}" class="btn btn-gradient-primary btn-modern px-5 py-3">
      <i class="bi bi-box-arrow-in-right me-2"></i>Return to Login
    </a>
  </div>
</div>
{% endblock %}
