{% extends "navbar.html" %}
{% block content %}

<div class="auth-container">
    <div class="auth-card animate-fade-in">
        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon" style="background: linear-gradient(135deg, #00ff88, #00d4ff);">
                <i class="bi bi-envelope-paper"></i>
            </div>
            <h1 class="auth-title">Make an Enquiry</h1>
            <p class="auth-subtitle">We'll get back to you as soon as possible</p>
        </div>

        <!-- Enquiry Form -->
        <form method="POST" class="modern-form">
            {% csrf_token %}

            <!-- User Info (Read-only) -->
            <div class="section-header">
                <i class="bi bi-person"></i>
                <h6>Your Details</h6>
            </div>

            <div class="form-floating-modern">
                <input type="text" class="form-control" value="{{ user.username }}" readonly />
                <i class="bi bi-person form-icon"></i>
            </div>

            <div class="form-floating-modern">
                <input type="email" class="form-control" value="{{ user.email }}" readonly />
                <i class="bi bi-envelope form-icon"></i>
            </div>

            <!-- Enquiry Details -->
            <div class="section-header">
                <i class="bi bi-chat-dots"></i>
                <h6>Your Message</h6>
            </div>

            {{ form.as_p }}

            <!-- Submit Button -->
            <button type="submit" class="btn btn-gradient-primary btn-modern w-100 py-3 mt-3">
                <i class="bi bi-send me-2"></i>Send Enquiry
            </button>
        </form>

        <!-- Footer Link -->
        <div class="auth-footer">
            <a href="javascript:history.back()">
                <i class="bi bi-arrow-left me-1"></i>Back to Product
            </a>
        </div>
    </div>
</div>

{% endblock %}
