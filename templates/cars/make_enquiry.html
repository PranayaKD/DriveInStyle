{% extends "cars/base.html" %}
{% block content %}

<div class="container my-5">
    <div class="card shadow-lg p-5"
        style="border-radius: 15px; background-color: #1a1a2e; color: #fff; max-width: 700px; margin: auto;">
        <h2 class="text-center mb-4 text-success">📩 Make an Enquiry</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" value="{{ user.username }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="{{ user.email }}" readonly>
            </div>
            {{ form.as_p }}
            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg mt-3">Send Enquiry</button>
            </div>
        </form>
    </div>
</div>

<style>
    input,
    textarea {
        border-radius: 8px;
        border: 1px solid #444;
        background-color: #222;
        color: #fff;
        padding: 10px;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #00ff99;
        box-shadow: 0 0 5px #00ff99;
    }

    .btn-success {
        border-radius: 50px;
        font-weight: 600;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn-success:hover {
        background-color: #00ff99;
        color: #000;
        transform: translateY(-2px);
        box-shadow: 0 0 10px #00ff99;
    }

    label {
        font-weight: 500;
    }
</style>

{% endblock %}
